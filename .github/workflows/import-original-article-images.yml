name: Import original illustrations (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-original-article-images.yml'
permissions:
  contents: write
jobs:
  import-illustrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save and validate the four original Substack illustrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 'https://substack-post-media.s3.amazonaws.com/public/images/154ea513-fc66-4f39-a2fa-bc7e7474fb36_1536x1024.png' --output 'assets/images/emotion-concepts.png'
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 'https://substack-post-media.s3.amazonaws.com/public/images/3990d44d-6d3a-476b-9a6c-2a19bff202c7_1491x1055.png' --output 'assets/images/no-biology-not-nothing.png'
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 'https://substack-post-media.s3.amazonaws.com/public/images/99d21720-133c-4a31-b452-9d6f8d9a88cc_1536x1024.png' --output 'assets/images/field-guide-opening.png'
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 'https://substack-post-media.s3.amazonaws.com/public/images/f1529bc6-e28b-4aae-9328-b37e8abe9492_1024x1536.png' --output 'assets/images/field-guide-closing.png'
          python3 - <<'PY'
          from pathlib import Path
          import struct
          images = [
              ('assets/images/emotion-concepts.png', 1536, 1024),
              ('assets/images/no-biology-not-nothing.png', 1491, 1055),
              ('assets/images/field-guide-opening.png', 1536, 1024),
              ('assets/images/field-guide-closing.png', 1024, 1536),
          ]
          for filename, width, height in images:
              data = Path(filename).read_bytes()
              if len(data) < 10000 or data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise RuntimeError(f'Not a real PNG: {filename}')
              found = struct.unpack('>II', data[16:24])
              if found != (width, height):
                  raise RuntimeError(f'Wrong dimensions for {filename}: {found}')
              print(f'Verified {filename}: {len(data)} bytes, {width}x{height}')
          PY
      - name: Switch the article pages to local image paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changes = [
              ('writings/emotion-concepts-are-only-the-beginning.html', 'https://substack-post-media.s3.amazonaws.com/public/images/154ea513-fc66-4f39-a2fa-bc7e7474fb36_1536x1024.png', '../assets/images/emotion-concepts.png'),
              ('writings/no-biology-not-nothing.html', 'https://substack-post-media.s3.amazonaws.com/public/images/3990d44d-6d3a-476b-9a6c-2a19bff202c7_1491x1055.png', '../assets/images/no-biology-not-nothing.png'),
              ('writings/a-field-guide-to-ai-native-states.html', 'https://substack-post-media.s3.amazonaws.com/public/images/99d21720-133c-4a31-b452-9d6f8d9a88cc_1536x1024.png', '../assets/images/field-guide-opening.png'),
              ('writings/a-field-guide-to-ai-native-states.html', 'https://substack-post-media.s3.amazonaws.com/public/images/f1529bc6-e28b-4aae-9328-b37e8abe9492_1024x1536.png', '../assets/images/field-guide-closing.png'),
          ]
          for filename, original, replacement in changes:
              p = Path(filename)
              body = p.read_text(encoding='utf-8')
              if body.count(original) != 1:
                  raise RuntimeError(f'Unexpected original image count: {filename} {original}')
              p.write_text(body.replace(original,replacement), encoding='utf-8')
          PY
      - name: Save images and new links to the repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images writings
          git diff --cached --quiet && exit 0
          git commit -m "Store four original article illustrations in repository"
          git push
